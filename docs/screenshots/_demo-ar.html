<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo AR card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/ai_object_recognition_system/assets/css/app.css" rel="stylesheet">
  <style>
    body.demo-body { margin:0; background:#0b1220; min-height:100vh; }
    .demo-stage {
      position:relative; width:100%; height:100vh; overflow:hidden;
      background:
        radial-gradient(ellipse at 40% 35%, rgba(94,234,212,.12), transparent 50%),
        linear-gradient(160deg, #1a2332 0%, #0b1220 55%, #111827 100%);
    }
    .demo-object {
      position:absolute; left:18%; top:16%; width:64%; height:42%;
      border-radius:18px;
      background: linear-gradient(145deg, #3b4559, #232a38);
      border:1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }
    .demo-object::after {
      content:"Sample product";
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      color:rgba(255,255,255,.35); font:600 1rem Outfit, system-ui, sans-serif;
      letter-spacing:.04em;
    }
    .detection-box {
      position:absolute; left:16%; top:14%; width:68%; height:46%;
      border:2px solid #5eead4; border-radius:14px;
      box-shadow: 0 0 0 1px rgba(94,234,212,.25), inset 0 0 30px rgba(94,234,212,.08);
      pointer-events:none;
    }
    .info-card {
      position:absolute; left:5%; top:58%; width:90%; max-width:360px;
      display:block !important;
    }
    .zh-line { display:block; opacity:.75; font-style:normal; font-size:.85em; }
    body[data-mode="collapsed"] .info-card-details { display:none !important; }
    body[data-mode="expanded"] .info-card-details { display:block !important; max-height:240px; overflow:auto; }
    .demo-header {
      position:absolute; top:0; left:0; right:0; z-index:5;
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 16px; color:#e8eef7;
      background:linear-gradient(to bottom, rgba(11,18,32,.9), transparent);
      font-family: Outfit, system-ui, sans-serif;
    }
    .demo-header h1 { margin:0; font-size:1rem; font-weight:700; }
    .demo-header span { font-size:.72rem; color:#94a3b8; }
  </style>
</head>
<body class="demo-body" data-mode="collapsed">
  <div class="demo-stage">
    <div class="demo-header">
      <div>
        <h1>AI + AR Object Scanner</h1>
        <span>Smart recognition overlay</span>
      </div>
      <div class="lang-switch">
        <button type="button" class="lang-btn active">EN</button>
        <button type="button" class="lang-btn">中文</button>
      </div>
    </div>
    <div class="demo-object" aria-hidden="true"></div>
    <div class="detection-box"></div>
    <div class="info-card" id="infoCard" aria-expanded="false">
      <div class="info-card-drag">
        <span class="drag-bars" aria-hidden="true"></span>
        <span class="drag-label">Drag</span>
      </div>
      <button type="button" class="info-card-summary">
        <strong>Wireless Headphones</strong>
        <em class="zh-line">无线耳机</em>
        <span id="cardHint">Tap for details</span>
      </button>
      <div class="info-card-details" id="details">
        <div class="detail-row">
          <span>Manufacturer</span>
          <strong>Sony</strong>
          <em class="zh-line">索尼</em>
        </div>
        <div class="detail-row">
          <span>Specification</span>
          <strong>Over-ear, Bluetooth 5.2</strong>
          <em class="zh-line">头戴式，蓝牙 5.2</em>
        </div>
        <div class="detail-row">
          <span>Description</span>
          <strong>Noise-cancelling wireless headphones for music and calls.</strong>
          <em class="zh-line">用于音乐与通话的降噪无线耳机。</em>
        </div>
        <div class="detail-row">
          <span>Confidence</span>
          <strong>92%</strong>
        </div>
        <div class="detail-row">
          <span>AI Provider</span>
          <strong>Gemini</strong>
        </div>
      </div>
    </div>
  </div>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'collapsed';
    document.body.setAttribute('data-mode', mode);
    const card = document.getElementById('infoCard');
    const hint = document.getElementById('cardHint');
    if (mode === 'expanded') {
      card.setAttribute('aria-expanded', 'true');
      card.classList.add('expanded');
      hint.textContent = 'Tap to collapse';
    }
  </script>
</body>
</html>
